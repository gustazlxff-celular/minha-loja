<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gust4 Cheats | Holograma iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #0a0a0a;
            --card-bg: #141414;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(0, 255, 65, 0.1), transparent);
        }

        .logo-img {
            height: 80px; /* Sua logo da segunda foto vai aqui */
            filter: drop-shadow(0 0 10px var(--neon-green));
        }

        .container {
            max-width: 1000px;
            width: 90%;
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .product-card {
            background: var(--card-bg);
            border: 2px solid var(--neon-green);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
        }

        .product-image {
            width: 100%;
            height: auto;
            border-bottom: 2px solid var(--neon-green);
        }

        .product-info {
            padding: 30px;
        }

        .product-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin: 10px 0;
            color: white;
        }

        .product-description {
            color: #ccc;
            margin-bottom: 20px;
        }

        .buy-button {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
        }

        .buy-button:hover {
            background: white;
            box-shadow: 0 0 20px white;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--neon-green);
            font-size: 0.8rem;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <!-- Use o nome da sua segunda imagem aqui para a logo -->
        <img src="logo_gust4_cheats.png" alt="Gust4 Cheats Logo" class="logo-img">
    </header>

    <div class="container">
        <h1>Produtos Disponíveis</h1>

        <div class="product-card">
            <!-- Use o nome da sua primeira imagem aqui para o produto -->
            <img src="holograma_ios.png" alt="Holograma iOS" class="product-image">
            
            <div class="product-info">
                <div class="product-title">HOLOGRAMA IOS</div>
                <p class="product-description">
                    Domine o campo de batalha com a melhor otimização visual para iOS. 
                    Tecnologia avançada, segura e com suporte dedicado.
                </p>
                <button class="buy-button">Comprar Agora</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 GUST4 CHEATS - MODS . SCRIPTS . OPTIMIZATION
    </footer>

</body>
</html>
