<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gust4 Cheats | Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #050505;
            --bg-card: #0d0e12;
            --bg-glass: rgba(17, 18, 23, 0.8);
            --accent: #00ff73;
            --accent-glow: rgba(0, 255, 115, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-gray: #a1a1aa;
            --transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px 15px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, rgba(0, 255, 115, 0.05), transparent 400px);
        }

        /* --- HEADER --- */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 500px; margin: 0 auto 30px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 48px; height: 48px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .brand-text { display: flex; flex-direction: column; }
        .brand-name { font-weight: 900; font-size: 1.2rem; line-height: 1; letter-spacing: -0.5px; }
        .verified { color: #3b82f6; font-size: 0.9rem; margin-left: 4px; }

        .nav-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border);
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; transition: var(--transition);
        }
        .icon-btn:active { transform: scale(0.9); }
        .cart-count {
            position: absolute; top: -5px; right: -5px; background: var(--accent);
            color: #000; font-size: 0.7rem; font-weight: 800;
            width: 18px; height: 18px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
        }

        /* --- GRID DE PRODUTOS --- */
        #store-home { max-width: 500px; margin: 0 auto; animation: fadeInUp 0.8s ease; }
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--text-gray); text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

        .product-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: 10px; cursor: pointer;
            transition: var(--transition); position: relative;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }

        .card-img-wrap { width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; margin-bottom: 12px; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .card-info h3 { font-size: 0.75rem; font-weight: 700; color: #f4f4f5; margin-bottom: 6px; height: 2.4em; overflow: hidden; }
        .card-price { font-size: 1.15rem; font-weight: 900; color: var(--text-main); display: block; }
        .card-subtext { font-size: 0.65rem; color: var(--text-gray); font-weight: 500; }

        /* --- MODAL DO CARRINHO --- */
        .cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 1000; display: none; justify-content: center; align-items: flex-end;
        }
        .cart-content {
            background: var(--bg-card); width: 100%; max-width: 500px;
            border-radius: 30px 30px 0 0; padding: 30px 20px;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .cart-items-list { max-height: 300px; overflow-y: auto; margin-bottom: 20px; }
        .cart-item {
            display: flex; align-items: center; gap: 15px; padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }
        .cart-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
        .cart-item-info { flex: 1; }
        .remove-btn { color: #ff4d4d; font-size: 0.75rem; font-weight: 700; cursor: pointer; }

        .cart-footer { border-top: 1px solid var(--border); padding-top: 20px; }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 20px; font-weight: 800; font-size: 1.2rem; }
        .btn-checkout { width: 100%; background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 16px; font-weight: 900; font-size: 1rem; cursor: pointer; }

        /* --- DETALHES --- */
        #details-view { display: none; max-width: 500px; margin: 0 auto; animation: fadeInUp 0.5s ease; }
        .btn-back { color: var(--text-gray); font-size: 0.8rem; font-weight: 700; border: none; background: none; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .hero-img { width: 100%; border-radius: 24px; border: 1px solid var(--border); margin-bottom: 20px; }
        .detail-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 5px; }
        .detail-price { font-size: 2.2rem; font-weight: 900; color: var(--accent); margin-bottom: 25px; }

        /* --- ANIMAÇÕES --- */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <div class="logo-box">
                <img src="logo_gust4_cheats.png" alt="Logo">
            </div>
            <div class="brand-text">
                <span class="brand-name">Gust4<span class="verified">✔</span></span>
                <span class="brand-name">Cheats</span>
            </div>
        </div>
        <div class="nav-actions">
            <div class="icon-btn">🔍</div>
            <div class="icon-btn" onclick="toggleCart()">
                🛒 <div id="cart-badge" class="cart-count">0</div>
            </div>
        </div>
    </nav>

    <main id="store-home">
        <p class="section-title">Nossos Produtos</p>
        <div class="product-grid">
            <!-- Produto 1 -->
            <div class="product-card" onclick="openProduct('HS PARA IOS VIA WIFI', 19.90, 'holograma_ios.PNG')">
                <div class="card-img-wrap">
                    <img src="holograma_ios.PNG">
                </div>
                <div class="card-info">
                    <h3>HS PARA IOS VIA WIFI</h3>
                    <span class="card-price">R$ 19,90</span>
                    <span class="card-subtext">À vista no Pix</span>
                </div>
            </div>
            <!-- Produto 2 -->
            <div class="product-card" onclick="openProduct('REGEDIT VIP MOBILE', 25.00, 'holograma_ios.PNG')">
                <div class="card-img-wrap">
                    <img src="holograma_ios.PNG" style="filter: hue-rotate(120deg);">
                </div>
                <div class="card-info">
                    <h3>REGEDIT VIP MOBILE (ULTRA)</h3>
                    <span class="card-price">R$ 25,00</span>
                    <span class="card-subtext">À vista no Pix</span>
                </div>
            </div>
        </div>
    </main>

    <section id="details-view">
        <button class="btn-back" onclick="closeProduct()">← VOLTAR PARA A LOJA</button>
        <img id="detail-img" class="hero-img">
        <h1 id="detail-name" class="detail-title">NOME</h1>
        <div id="detail-price" class="detail-price">R$ 0,00</div>
        
        <button class="btn-checkout" id="add-to-cart-btn" style="background: #fff; margin-bottom: 15px;">ADICIONAR AO CARRINHO</button>
        
        <div style="background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center;">
            <p style="font-size: 0.8rem; color: var(--text-gray);">Entrega automática via e-mail 📦</p>
        </div>
    </section>

    <!-- CARRINHO MODAL -->
    <div id="cart-modal" class="cart-modal" onclick="if(event.target == this) toggleCart()">
        <div class="cart-content">
            <div class="cart-header">
                <h2 style="font-weight: 900;">Meu Carrinho</h2>
                <div onclick="toggleCart()" style="cursor: pointer; opacity: 0.5;">FECHAR</div>
            </div>
            
            <div id="cart-items" class="cart-items-list">
                <!-- Itens entram aqui -->
            </div>

            <div class="cart-footer">
                <div class="total-row">
                    <span>Total</span>
                    <span id="cart-total-val">R$ 0,00</span>
                </div>
                <button class="btn-checkout" onclick="alert('Pedido finalizado! Redirecionando...')">FINALIZAR COMPRA</button>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let currentProduct = null;

        function openProduct(name, price, img) {
            currentProduct = { name, price, img };
            document.getElementById('store-home').style.display = 'none';
            document.getElementById('details-view').style.display = 'block';
            document.getElementById('detail-name').innerText = name;
            document.getElementById('detail-price').innerText = `R$ ${price.toFixed(2).replace('.', ',')}`;
            document.getElementById('detail-img').src = img;
            
            document.getElementById('add-to-cart-btn').onclick = () => {
                addToCart(currentProduct);
                closeProduct();
                toggleCart();
            };
            window.scrollTo(0,0);
        }

        function closeProduct() {
            document.getElementById('details-view').style.display = 'none';
            document.getElementById('store-home').style.display = 'block';
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
            renderCart();
        }

        function addToCart(product) {
            cart.push(product);
            updateBadge();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateBadge();
        }

        function updateBadge() {
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            badge.style.display = cart.length > 0 ? 'flex' : 'none';
        }

        function renderCart() {
            const list = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total-val');
            list.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:gray; padding: 20px;">Seu carrinho está vazio.</p>';
            }

            cart.forEach((item, index) => {
                total += item.price;
                list.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.img}">
                        <div class="cart-item-info">
                            <p style="font-weight:700; font-size:0.85rem;">${item.name}</p>
                            <p style="color:var(--accent); font-weight:800;">R$ ${item.price.toFixed(2).replace('.', ',')}</p>
                        </div>
                        <span class="remove-btn" onclick="removeFromCart(${index})">Remover</span>
                    </div>
                `;
            });

            totalEl.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
    </script>
</body>
</html>
