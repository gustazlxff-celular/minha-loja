<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gust4 Cheats | Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #08090b;
            --bg-card: #111217;
            --bg-item: #191a21;
            --accent: #00ff73;
            --border: #23242b;
            --text-gray: #8b8e99;
            --white: #ffffff;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; 
        }

        body { background-color: var(--bg-body); color: var(--white); padding: 15px; }

        /* HEADER CORRIGIDO */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 500px; margin: 10px auto 30px;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-logo {
            width: 45px; height: 45px; border-radius: 12px;
            object-fit: cover; border: 1px solid var(--border);
        }
        .brand-text { display: flex; flex-direction: column; }
        .brand-name { font-weight: 800; font-size: 1.1rem; line-height: 1.1; }
        .verified-badge { color: #3b82f6; font-size: 0.8rem; margin-left: 4px; }

        .nav-icons { display: flex; gap: 10px; }
        .icon-btn {
            background: var(--bg-card); border: 1px solid var(--border);
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }

        /* GRID DE PRODUTOS PEQUENOS */
        #main-store { max-width: 500px; margin: 0 auto; animation: fadeIn 0.4s ease; }
        
        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }

        .product-card {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 18px; padding: 8px; cursor: pointer;
            transition: 0.3s; transform-style: preserve-3d;
        }

        .product-card:hover { border-color: var(--accent); transform: translateY(-3px); }

        .card-img {
            width: 100%; aspect-ratio: 1/1; border-radius: 14px;
            object-fit: cover; margin-bottom: 10px;
        }

        .card-info { padding: 0 4px 8px; }
        .card-title { font-size: 0.7rem; font-weight: 700; color: #ddd; margin-bottom: 4px; height: 2.2em; overflow: hidden; }
        .card-price { font-size: 1rem; font-weight: 800; display: block; }
        .card-pix { font-size: 0.6rem; color: var(--text-gray); }

        /* ABA DE PLANOS */
        #details-page { display: none; max-width: 500px; margin: 0 auto; animation: slideUp 0.4s ease; }
        .back-nav { color: var(--text-gray); font-size: 0.8rem; margin-bottom: 20px; cursor: pointer; font-weight: 600; }
        .detail-hero { width: 100%; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }

        .plans-list { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .plan-item {
            background: var(--bg-card); border: 1.5px solid var(--border);
            border-radius: 16px; padding: 15px; display: flex;
            justify-content: space-between; align-items: center; cursor: pointer;
        }
        .plan-item.active { border-color: var(--accent); background: #131b16; }
        .plan-radio { width: 18px; height: 18px; border: 2px solid #3e404d; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; }
        .active .plan-radio { border-color: var(--accent); }
        .active .plan-radio::after { content: ''; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }

        .btn-buy { width: 100%; background: #fff; color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }

        .info-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; margin-top: 15px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <!-- Coloque sua logo aqui -->
            <img src="https://i.imgur.com/your_logo.png" class="brand-logo" onerror="this.src='https://via.placeholder.com/45/FFFFFF/000000?text=G'">
            <div class="brand-text">
                <span class="brand-name">Gust4<span class="verified-badge">✔</span></span>
                <span class="brand-name">Cheats</span>
            </div>
        </div>
        <div class="nav-icons">
            <div class="icon-btn">🔍</div>
            <div class="icon-btn">🛒</div>
        </div>
    </nav>

    <main id="main-store">
        <div class="product-grid">
            <!-- PRODUTO 1 -->
            <div class="product-card tilt-js" onclick="openDetails('HS PARA IOS VIA WIFI', '19,90')">
                <img src="holograma_ios.PNG" class="card-img" alt="HS iOS">
                <div class="card-info">
                    <h3 class="card-title">HS PARA IOS VIA WIFI</h3>
                    <span class="card-price">R$ 19,90</span>
                    <span class="card-pix">À vista no Pix</span>
                </div>
            </div>

            <!-- PRODUTO 2 (Exemplo de organização) -->
            <div class="product-card tilt-js" onclick="openDetails('REGEDIT VIP', '25,00')">
                <img src="https://via.placeholder.com/200/191a21/00ff73?text=REGEDIT" class="card-img">
                <div class="card-info">
                    <h3 class="card-title">REGEDIT VIP MOBILE</h3>
                    <span class="card-price">R$ 25,00</span>
                    <span class="card-pix">À vista no Pix</span>
                </div>
            </div>
        </div>
    </main>

    <section id="details-page">
        <div class="back-nav" onclick="closeDetails()">← VOLTAR PARA A LOJA</div>
        <img id="det-img" src="holograma_ios.PNG" class="detail-hero">
        <h1 id="det-name" style="font-size: 1.4rem; font-weight: 800;">HS PARA IOS</h1>
        <div id="det-price" style="font-size: 2rem; font-weight: 800; color: var(--accent); margin: 10px 0;">R$ 19,90</div>

        <div class="plans-list">
            <div class="plan-item active" onclick="select(this, '19,90')">
                <div style="display:flex; align-items:center;"><div class="plan-radio"></div><span>DIÁRIO</span></div>
                <div style="font-weight:700;">R$ 19,90</div>
            </div>
            <div class="plan-item" onclick="select(this, '49,90')">
                <div style="display:flex; align-items:center;"><div class="plan-radio"></div><span>SEMANAL</span></div>
                <div style="font-weight:700;">R$ 49,90</div>
            </div>
        </div>

        <button class="btn-buy">COMPRAR AGORA</button>
        <div class="info-card tilt-js">
            <h4 style="margin-bottom:5px;">Entrega Automática 📦</h4>
            <p style="font-size:0.75rem; color:var(--text-gray);">O produto é enviado para seu e-mail após a confirmação.</p>
        </div>
    </section>

    <script>
        function openDetails(name, price) {
            document.getElementById('main-store').style.display = 'none';
            document.getElementById('details-page').style.display = 'block';
            document.getElementById('det-name').innerText = name;
            document.getElementById('det-price').innerText = `R$ ${price}`;
            window.scrollTo(0,0);
        }

        function closeDetails() {
            document.getElementById('details-page').style.display = 'none';
            document.getElementById('main-store').style.display = 'block';
        }

        function select(el, price) {
            document.querySelectorAll('.plan-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('det-price').innerText = `R$ ${price}`;
        }

        // EFEITO DE MOVIMENTO
        document.addEventListener('mousemove', (e) => {
            document.querySelectorAll('.tilt-js').forEach(card => {
                let rect = card.getBoundingClientRect();
                let x = (e.clientX - rect.left) / rect.width - 0.5;
                let y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.transform = `perspective(1000px) rotateY(${x * 15}deg) rotateX(${-y * 15}deg) translateY(-3px)`;
            });
        });
    </script>
</body>
</html>
