<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gust4 Cheats | Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #0c0d11;
            --accent-green: #00ff73;
            --text-main: #ffffff;
            --text-dim: #92929b;
            --border: #1d1d25;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 400px;
            width: 100%;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px 25px 5px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .brand-name {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
        }

        /* GRID ESTILO LUX CHEATS */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        /* IMAGEM COM EXTENSÃO .PNG CORRIGIDA */
        .product-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 8px;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: #14151a;
        }

        .product-name {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
            height: 34px;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* SELEÇÃO DE PREÇOS */
        .plan-select {
            background: #16171d;
            border: 1px solid var(--border);
            color: #fff;
            font-size: 0.7rem;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .price-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 4px;
        }

        .price-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .pix-badge {
            width: 18px;
            height: 18px;
            background-color: var(--accent-green);
            /* Ícone do Pix */
            mask: url('https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_Pix.svg') no-repeat center;
            -webkit-mask: url('https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_Pix.svg') no-repeat center;
            mask-size: contain;
        }

        .pix-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: block;
        }

        /* BOTÃO BRANCO IGUAL AO PRINT */
        .btn-buy {
            background: #ffffff;
            color: #000000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: auto;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        #cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-green);
            color: #000;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo-area">
                <img src="logo_gust4_cheats.png" class="logo-img" alt="Logo">
                <span class="brand-name">Gust4 Cheats</span>
            </div>
            <div class="cart-icon">
                🛒 <span id="cart-count">0</span>
            </div>
        </header>

        <div class="products-grid">
            <!-- CARD HOLOGRAMA IOS -->
            <div class="product-card">
                <img src="holograma_ios.PNG" class="product-image" alt="Holograma iOS">
                <div class="product-name">Holograma iOS</div>
                
                <select class="plan-select" id="plan-selector" onchange="changePrice()">
                    <option value="15">1 Dia - R$ 15</option>
                    <option value="25">7 Dias - R$ 25</option>
                    <option value="50">30 Dias - R$ 50</option>
                </select>

                <div class="price-container">
                    <span class="price-val" id="price-display">R$ 15,00+</span>
                    <div class="pix-badge"></div>
                </div>
                <span class="pix-label">À vista no Pix</span>

                <button class="btn-buy" onclick="addToCart()">Comprar agora</button>
            </div>
            
            <!-- Espaço para futuros produtos -->
        </div>
    </div>

    <script>
        function changePrice() {
            const val = document.getElementById('plan-selector').value;
            document.getElementById('price-display').innerText = `R$ ${val},00+`;
        }

        let items = 0;
        function addToCart() {
            items++;
            document.getElementById('cart-count').innerText = items;
            const selectedPlan = document.getElementById('plan-selector').options[document.getElementById('plan-selector').selectedIndex].text;
            console.log("Adicionado: " + selectedPlan);
        }
    </script>
</body>
</html>
