<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUST4 CHEATS | OFFICIAL STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41;
            --bg: #000000;
            --card-bg: rgba(10, 10, 10, 0.8);
            --neon-glow: 0 0 25px rgba(0, 255, 65, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* FUNDO DINÂMICO */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 50% -20%, #0a2a0a 0%, transparent 50%),
                linear-gradient(rgba(0, 255, 65, 0.02) 1px, transparent 1px) 0 0 / 30px 30px,
                linear-gradient(90deg, rgba(0, 255, 65, 0.02) 1px, transparent 1px) 0 0 / 30px 30px;
            z-index: -1;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            animation: fadeInDown 1s ease;
        }

        .logo-main {
            height: 130px;
            filter: drop-shadow(var(--neon-glow));
        }

        /* GRID DE PRODUTOS - Pronto para o futuro */
        .shop-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto 50px;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }

        .card-img-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }

        .card-img-box img {
            width: 100%;
            display: block;
            transition: 0.5s;
        }

        .card:hover .card-img-box img { transform: scale(1.05); }

        .title {
            font-family: 'Syncopate', sans-serif;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .desc {
            font-size: 0.85rem;
            color: #999;
            line-height: 1.5;
            margin-bottom: 20px;
            min-height: 40px;
        }

        .price-tag {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .btn-action {
            background: var(--primary);
            color: #000;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
            flex-grow: 1;
            text-align: center;
        }

        .btn-action:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px var(--primary);
        }

        /* ANIMAÇÕES */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #444;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <img src="logo_gust4_cheats.png" alt="LOGO GUST4" class="logo-main">
    </header>

    <main class="shop-container">
        
        <!-- PRODUTO 1: HOLOGRAMA -->
        <article class="card">
            <div class="card-img-box">
                <img src="holograma_ios.PNG" alt="HOLOGRAMA iOS">
            </div>
            <h3 class="title">HOLOGRAMA iOS</h3>
            <p class="desc">Tecnologia visual de elite para o seu dispositivo. Performance e estética em um só lugar.</p>
            <div class="price-tag">
                <a href="#" class="btn-action">ADQUIRIR AGORA</a>
            </div>
        </article>

        <!-- ESPAÇO PARA PRODUTOS FUTUROS (Exemplo) -->
        <!-- Basta copiar o bloco do 'article' acima e colar aqui embaixo -->

    </main>

    <footer>
        GUST4 CHEATS &copy; 2026 - MODS & OPTIMIZATION
    </footer>

</body>
</html>
