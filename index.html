<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUST4 CHEATS | PREMIUM iOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41; /* Verde Matrix */
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Background Animado */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 65, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        header {
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            backdrop-filter: blur(10px);
        }

        .logo-box img {
            height: 100px;
            filter: drop-shadow(var(--neon-shadow));
            transition: 0.5s;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .hero-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 40px;
            color: var(--primary);
            text-shadow: var(--neon-shadow);
        }

        /* Card do Produto Estilo Premium */
        .product-grid {
            display: flex;
            justify-content: center;
        }

        .product-card {
            background: var(--glass);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .product-card::after {
            content: "TOP VENDAS";
            position: absolute;
            top: -10px; right: 20px;
            background: var(--primary);
            color: #000;
            padding: 5px 15px;
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 50px;
        }

        .image-container {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .image-container img {
            width: 100%;
            display: block;
            transition: 0.5s;
        }

        .product-card:hover .image-container img {
            transform: scale(1.05);
        }

        .product-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.8rem;
            margin: 15px 0;
            letter-spacing: -1px;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 255, 65, 0.1);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .features {
            text-align: left;
            margin: 20px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .features li {
            list-style: none;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .features li::before {
            content: "✓";
            color: var(--primary);
            margin-right: 10px;
            font-weight: bold;
        }

        .btn-buy {
            display: block;
            width: 100%;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: var(--neon-shadow);
        }

        .btn-buy:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <img src="logo_gust4_cheats.png" alt="GUST4 CHEATS">
        </div>
    </header>

    <div class="container">
        <h2 class="hero-title">MODIFICAÇÕES DE ALTO NÍVEL</h2>

        <div class="product-grid">
            <div class="product-card">
                <div class="image-container">
                    <img src="holograma_ios.PNG" alt="HOLOGRAMA IOS">
                </div>
                <span class="badge">SISTEMA iOS ATUALIZADO</span>
                <h3 class="product-title">HOLOGRAMA iOS</h3>
                
                <ul class="features">
                    <li>Otimização Visual Avançada</li>
                    <li>Anti-Ban System 2026</li>
                    <li>Instalação Simplificada (iSH/Filza)</li>
                    <li>Suporte 24/7 via Telegram</li>
                </ul>

                <a href="#" class="btn-buy">ADQUIRIR AGORA</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 GUST4 CHEATS - TODOS OS DIREITOS RESERVADOS
    </footer>

</body>
</html>
