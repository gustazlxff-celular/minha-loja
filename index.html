<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUST4 CHEATS | iOS PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41;
            --bg-dark: #000000;
            --neon-glow: 0 0 20px rgba(0, 255, 65, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* FUNDO MELHORADO: Grid Dinâmica + Brilho Central */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                radial-gradient(circle at center, #051a05 0%, #000000 80%);
            background-size: 30px 30px, 30px 30px, 100% 100%;
            z-index: -1;
        }

        /* Efeito de Scanline (Linhas de monitor antigo) */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            z-index: 10;
        }

        .logo-box img {
            height: 120px;
            filter: drop-shadow(var(--neon-glow));
            transition: 0.4s;
        }

        .container {
            width: 90%;
            max-width: 450px;
            z-index: 10;
            padding-bottom: 50px;
        }

        /* CARD DO PRODUTO */
        .product-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--primary);
            border-radius: 25px;
            padding: 20px;
            box-shadow: var(--neon-glow);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .image-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 65, 0.3);
        }

        .image-container img {
            width: 100%;
            display: block;
        }

        .product-title {
            font-family: 'Syncopate', sans-serif;
            color: var(--primary);
            font-size: 1.4rem;
            margin: 15px 0;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .product-desc {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-buy {
            display: block;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .btn-buy:hover {
            transform: scale(1.03);
            filter: brightness(1.2);
        }

        footer {
            margin-top: auto;
            padding: 30px;
            color: rgba(0, 255, 65, 0.4);
            font-family: 'Syncopate', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <!-- Certifique-se que o nome da logo está correto no Github -->
            <img src="logo_gust4_cheats.png" alt="GUST4 CHEATS">
        </div>
    </header>

    <div class="container">
        <div class="product-card">
            <div class="image-container">
                <!-- CORREÇÃO APLICADA: .PNG em maiúsculo -->
                <img src="holograma_ios.PNG" alt="HOLOGRAMA IOS">
            </div>
            
            <h3 class="product-title">HOLOGRAMA IOS</h3>
            <p class="product-desc">
                A evolução do modding visual. Desempenho máximo, segurança total e estética neon imbatível para o seu dispositivo.
            </p>

            <a href="https://t.me/seu_link" class="btn-buy">COMPRAR AGORA</a>
        </div>
    </div>

    <footer>
        GUST4 CHEATS &copy; 2026 - PREMIUM QUALITY
    </footer>

</body>
</html>
