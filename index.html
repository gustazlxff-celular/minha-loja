<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gust4 Cheats | Store</title>
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --accent-green: #00ff66; /* Verde Neon */
            --accent-dim: #008033;
            --text-main: #ffffff;
            --border-color: #1e1e1e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }

        /* Header similar ao image_2.png */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px 20px 5px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .verified-badge {
            color: #3d5afe; /* Azul de verificado conforme o print */
            font-size: 14px;
        }

        .cart-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
        }

        #cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--accent-green);
            color: #000;
            font-weight: bold;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* Grid de Produtos */
        .grid-products {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas como no mobile */
            gap: 12px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 500;
            margin: 5px 0;
            height: 40px; /* Mantém alinhamento */
            overflow: hidden;
        }

        .price-area {
            margin: 10px 0;
        }

        .price-tag {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .pix-info {
            font-size: 0.7rem;
            color: #888;
        }

        /* Botão de Compra */
        .btn-buy {
            background: var(--accent-green);
            color: #000;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: auto;
        }

        .btn-buy:hover {
            background: #00cc52;
        }

    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <strong style="font-size: 1.2rem;">Gust4 Cheats</strong>
            <span class="verified-badge">✔</span>
        </div>
        <button class="cart-btn">
            🛒 <span id="cart-count">0</span>
        </button>
    </div>

    <div class="grid-products">
        <!-- Produto 1 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/150/121212/00ff66?text=HS+WIFI" class="product-img">
            <div class="product-title">HS PARA IOS VIA WIFI 1 DIA</div>
            <div class="price-area">
                <span class="price-tag">R$ 19,90</span><br>
                <span class="pix-info">À vista no Pix</span>
            </div>
            <button class="btn-buy" onclick="addToCart('HS WIFI 1D', 19.90)">Comprar agora</button>
        </div>

        <!-- Produto 2 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/150/121212/00ff66?text=FFH4X" class="product-img">
            <div class="product-title">Painel ffh4x ios</div>
            <div class="price-area">
                <span class="price-tag">R$ 15,00</span><br>
                <span class="pix-info">À vista no Pix</span>
            </div>
            <button class="btn-buy" onclick="addToCart('Painel FFH4X', 15.00)">Comprar agora</button>
        </div>

        <!-- Produto 3 -->
        <div class="product-card">
            <img src="https://via.placeholder.com/150/121212/00ff66?text=CERTIFICADO" class="product-img">
            <div class="product-title">CERTIFICADO iOS PREMIUM</div>
            <div class="price-area">
                <span class="price-tag">R$ 79,90</span><br>
                <span class="pix-info">À vista no Pix</span>
            </div>
            <button class="btn-buy" onclick="addToCart('Certificado Premium', 79.90)">Comprar agora</button>
        </div>
    </div>

    <script>
        // Sistema de Carrinho
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function updateCartUI() {
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            document.getElementById('cart-count').innerText = count;
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function addToCart(name, price) {
            const itemIndex = cart.findIndex(item => item.name === name);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            updateCartUI();
            
            // Pequeno feedback visual
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "ADICIONADO!";
            btn.style.background = "#fff";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--accent-green)";
            }, 1000);
        }

        updateCartUI();
    </script>
</body>
</html>
