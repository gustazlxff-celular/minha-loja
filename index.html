<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gust4 Cheats | Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: #0c0d11;
            --bg-input: #16171d;
            --accent-green: #00ff73;
            --text-main: #ffffff;
            --text-dim: #92929b;
            --border: #1d1d25;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 35px; height: 35px; }
        .brand-name { font-weight: 800; font-size: 1.1rem; }

        /* PÁGINA PRINCIPAL (GRID) */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
            display: block;
            object-fit: contain; /* Garante que a imagem fique totalmente visível */
        }

        .product-title {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .main-price {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .pix-tag {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: block;
        }

        /* TELA DE DETALHES (ESTILO SEGUNDA PRINT) */
        #product-details {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-deep);
            z-index: 100;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .details-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .btn-back {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .details-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .details-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        /* OPÇÕES DE PLANOS (BOTÕES RÁDIO) */
        .plans-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .plan-option {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .plan-option.active {
            border-color: var(--accent-green);
            background: #00ff7305;
        }

        .plan-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .radio-circle {
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plan-option.active .radio-circle {
            border-color: var(--accent-green);
        }

        .plan-option.active .radio-circle::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
        }

        .plan-label { font-weight: 600; font-size: 0.9rem; }
        .plan-price { font-weight: 800; font-size: 1rem; }

        /* BOTÕES DE AÇÃO */
        .action-buttons {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 40px;
        }

        .btn-buy-now {
            background: white;
            color: black;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .btn-add-cart {
            background: transparent;
            color: white;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- PÁGINA PRINCIPAL -->
    <div id="main-store">
        <header class="header">
            <div class="logo-area">
                <img src="logo_gust4_cheats.png" class="logo-img" alt="Logo">
                <span class="brand-name">Gust4 Cheats</span>
            </div>
            <span>🛒</span>
        </header>

        <div class="container">
            <div class="products-grid">
                <!-- Card do Produto -->
                <div class="product-card" onclick="openDetails()">
                    <img src="holograma_ios.PNG" class="product-image" alt="Holograma iOS">
                    <div class="product-title">Holograma iOS</div>
                    <div class="main-price">R$ 15,00+</div>
                    <span class="pix-tag">À vista no Pix</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ABA DE DETALHES (ABRE AO CLICAR NO PRODUTO) -->
    <div id="product-details">
        <div class="details-header">
            <button class="btn-back" onclick="closeDetails()">← Voltar</button>
            <span style="font-weight: 700;">Detalhes</span>
        </div>

        <img src="holograma_ios.PNG" class="details-img" alt="Holograma iOS">
        
        <div class="details-title">HOLOGRAMA IOS</div>
        <div style="color: var(--accent-green); font-weight: 800; font-size: 1.4rem;">R$ <span id="dynamic-price">15,00</span></div>
        <span class="pix-tag">À vista no Pix</span>

        <div class="plans-container">
            <!-- Plano 1 Dia -->
            <div class="plan-option active" onclick="selectPlan(this, '15,00')">
                <div class="plan-info">
                    <div class="radio-circle"></div>
                    <span class="plan-label">Holograma iOS - 1 Dia</span>
                </div>
                <div class="plan-price">R$ 15,00</div>
            </div>

            <!-- Plano 7 Dias -->
            <div class="plan-option" onclick="selectPlan(this, '25,00')">
                <div class="plan-info">
                    <div class="radio-circle"></div>
                    <span class="plan-label">Holograma iOS - 7 Dias</span>
                </div>
                <div class="plan-price">R$ 25,00</div>
            </div>

            <!-- Plano 30 Dias -->
            <div class="plan-option" onclick="selectPlan(this, '50,00')">
                <div class="plan-info">
                    <div class="radio-circle"></div>
                    <span class="plan-label">Holograma iOS - 30 Dias</span>
                </div>
                <div class="plan-price">R$ 50,00</div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-buy-now">🛒 Comprar agora</button>
            <button class="btn-add-cart">+ Adicionar ao carrinho</button>
        </div>
    </div>

    <script>
        function openDetails() {
            document.getElementById('main-store').style.display = 'none';
            document.getElementById('product-details').style.display = 'block';
            window.scrollTo(0,0);
        }

        function closeDetails() {
            document.getElementById('main-store').style.display = 'block';
            document.getElementById('product-details').style.display = 'none';
        }

        function selectPlan(element, price) {
            // Remove classe ativa de todos
            document.querySelectorAll('.plan-option').forEach(opt => {
                opt.classList.remove('active');
            });
            // Adiciona no clicado
            element.classList.add('active');
            // Atualiza o preço no topo
            document.getElementById('dynamic-price').innerText = price;
        }
    </script>
</body>
</html>
